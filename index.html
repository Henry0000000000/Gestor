<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Anime PWA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header>
        <h1>Mi Gestor de Anime</h1>
        <div class="actions">
            <button onclick="exportarDatos()">Exportar JSON</button>
            <input type="file" id="importFile" accept=".json" onchange="importarDatos(event)" style="display: none;">
            <button onclick="document.getElementById('importFile').click()">Importar JSON</button>
        </div>
    </header>

    <main>
        <section class="search-section">
            <select id="searchType">
                <option value="ANIME">Anime</option>
                <option value="MANGA">Manga / Manhwa</option>
            </select>
            <input type="text" id="searchInput" placeholder="Buscar título...">
            <button onclick="buscarAnime()">Buscar</button>
        </section>

        <section id="searchResults" class="grid-container hidden"></section>

        <div class="list-header">
            <h2>Mi Lista Guardada</h2>
            <div class="filters">
                <select id="filtroTipo" onchange="renderizarMiLista()">
                    <option value="Todos">Todos los tipos</option>
                    <option value="ANIME">Anime</option>
                    <option value="MANGA">Manga / Manhwa</option>
                </select>
                <select id="filtroEstado" onchange="renderizarMiLista()">
                    <option value="Todos">Todos los estados</option>
                    <option value="Viendo">Viendo</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="Terminado">Terminado</option>
                </select>
                <select id="filtroOrden" onchange="renderizarMiLista()">
                    <option value="original">Orden de agregado</option>
                    <option value="az">Nombre (A - Z)</option>
                    <option value="za">Nombre (Z - A)</option>
                </select>
            </div>
        </div>
        <section id="myList" class="grid-container"></section>
    </main>

    <script src="app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker registrado correctamente.'))
                .catch(err => console.log('Error al registrar Service Worker:', err));
        }
    </script>

</body>
</html>
